# ============================================================================
# CRM ACLR Sàrl — Orchestration prod (Hetzner Cloud)
# ============================================================================
# Lancement : docker compose up -d
# Le serveur Hetzner CX22 (ou +) fait tourner 3 services :
#   - postgres  : base de données PostgreSQL 16
#   - web       : application Next.js (image construite depuis ./Dockerfile)
#   - backup    : dump quotidien de la base à 03:00 (Europe/Zurich)
#
# Pré-requis serveur :
#   - Docker Engine + docker compose plugin
#   - Fichier .env présent à la racine (cf .env.example)
#   - Reverse proxy (Caddy ou Traefik) externe pour HTTPS + domaine
# ============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Zurich}
      PGTZ: ${TZ:-Europe/Zurich}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # En prod on n'expose PAS Postgres sur l'hôte — accessible seulement
    # depuis le réseau interne `crm_net`.
    networks:
      - crm_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      EMAIL_MODE: ${EMAIL_MODE:-dry-run}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_INBOUND_TOKEN: ${RESEND_INBOUND_TOKEN:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-prospects@aclr.ch}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      TZ: ${TZ:-Europe/Zurich}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Stockage local des pièces jointes en cas de STORAGE_MODE=local
      - storage:/app/storage
    networks:
      - crm_net

  cron:
    # Tâche nocturne à 02:00 (Europe/Zurich)
    # Appelle l'endpoint /api/cron/nightly du service web pour :
    #   - traiter les anniversaires de contrats (auto-renouvellement)
    #   - passer à PAYE les étalements de commission échus
    #   - créer les snapshots Stat quotidiens
    #   - générer les factures mensuelles Sophie le 1-5 du mois
    image: alpine:3.19
    container_name: crm_cron
    restart: unless-stopped
    depends_on:
      - web
    environment:
      TZ: ${TZ:-Europe/Zurich}
      CRON_SECRET: ${CRON_SECRET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        echo "0 2 * * * curl -fsS -X POST -H 'x-cron-secret: $$CRON_SECRET' http://web:3000/api/cron/nightly >> /var/log/cron.log 2>&1" > /etc/crontabs/root
        touch /var/log/cron.log
        crond -f -d 8 &
        tail -f /var/log/cron.log
    networks:
      - crm_net

  backup:
    image: postgres:16-alpine
    container_name: crm_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: postgres
      TZ: ${TZ:-Europe/Zurich}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Dump quotidien à 03:00 — garde 30 jours d'historique
        echo "0 3 * * * pg_dump -Fc --no-owner --no-acl --file=/backups/crm_$$(date +\%Y\%m\%d_\%H\%M\%S).dump && find /backups -type f -name 'crm_*.dump' -mtime +30 -delete" > /etc/crontabs/root
        crond -f -d 8
    networks:
      - crm_net

volumes:
  postgres_data:
    driver: local
  storage:
    driver: local

networks:
  crm_net:
    driver: bridge
